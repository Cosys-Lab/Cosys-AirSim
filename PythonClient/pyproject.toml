[build-system]
requires = ["setuptools", "wheel", "hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosysairsim"
version = "3.3.1.dev0"
description = "This package contains simple Python client for Cosys-AirSim. This integrates most API functions over RPC."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "Shital Shah", email = "shitals@microsoft.com" },
           { name = "Wouter Jansen", email = "wouter.jansen@uantwerpen.be" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 6 - Mature",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
keywords = ["simulation", "airsim", "api"]
dependencies = [
    "numpy",
    "rpc-msgpack"
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pyupgrade",
]

[project.urls]
Repository = "https://github.com/Cosys-Lab/Cosys-AirSim"
Documentation = "https://cosys-lab.github.io/Cosys-AirSim/"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.package-data]
cosysairsim = ["colormap.npy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cosysairsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "F403",  # star import - intentional for public API
    "F405",  # undefined from star import
]

[tool.ruff.lint.isort]
known-first-party = ["cosysairsim"]